# Montajes de producción. Los nombres de los volúmenes conservan los datos existentes.
volumes:
  sites:
    name: ${COMPOSE_PROJECT_NAME}-sites-bind
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/frappe/sites
  db-data:
    name: ${COMPOSE_PROJECT_NAME}-db-bind
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/mariadb
  redis-queue-data:
    name: ${COMPOSE_PROJECT_NAME}-redis-queue-bind
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/redis-queue
  cert-data:
    name: ${COMPOSE_PROJECT_NAME}-cert-bind
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/traefik

services:
  redis-cache:
    volumes:
      - ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/redis-cache:/data
  configurator:
    volumes:
      - ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/frappe/logs/configurator:/home/frappe/frappe-bench/logs
  backend:
    volumes:
      - ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/frappe/logs/backend:/home/frappe/frappe-bench/logs
  frontend:
    volumes:
      - ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/frappe/logs/frontend:/home/frappe/frappe-bench/logs
  websocket:
    volumes:
      - ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/frappe/logs/websocket:/home/frappe/frappe-bench/logs
  queue-short:
    volumes:
      - ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/frappe/logs/queue-short:/home/frappe/frappe-bench/logs
  queue-long:
    volumes:
      - ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/frappe/logs/queue-long:/home/frappe/frappe-bench/logs
  scheduler:
    volumes:
      - ${ERPNEXT_DATA_ROOT:?Set ERPNEXT_DATA_ROOT}/frappe/logs/scheduler:/home/frappe/frappe-bench/logs
