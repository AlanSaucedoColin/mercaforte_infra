services:
  db:
    configs:
      - source: mariadb-dev
        target: /etc/mysql/conf.d/erpnext-dev.cnf

  configurator:
    platform: linux/arm64

  backend:
    platform: linux/arm64

  frontend:
    platform: linux/arm64

  websocket:
    platform: linux/arm64

  queue-short:
    platform: linux/arm64

  queue-long:
    platform: linux/arm64

  scheduler:
    platform: linux/arm64

configs:
  mariadb-dev:
    content: |
      [mysqld]
      lower_case_table_names=1
