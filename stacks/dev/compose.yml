services:
  osrm:
    build:
      context: ./osrm
    image: mercaforte-osrm-routing:6.0.0
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    stop_grace_period: 30s
    environment:
      ROUTING_MANAGER_TOKEN: ${ROUTING_MANAGER_TOKEN:?Define a shared routing manager secret of at least 24 characters}
      ROUTING_DB_HOST: postgres
      ROUTING_DB_NAME: ${ROUTING_DB_NAME:-mercaforte}
      ROUTING_DB_USER: ${ROUTING_DB_USER:-mercaforte}
      ROUTING_DB_PASSWORD: ${ROUTING_DB_PASSWORD:-mercaforte}
      ROUTING_PREPARE_TIMEOUT: ${ROUTING_PREPARE_TIMEOUT:-900}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data/osrm:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:5000/nearest/v1/driving/-99.2216,18.9242" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: ${ROUTING_HEALTH_START_PERIOD:-35m}

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    environment:
      VROOM_ROUTER: osrm
      VROOM_LOG: /conf
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/vroom:/conf
      - type: bind
        source: ./configs/vroom/config.yml
        target: /conf/config.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3000/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      osrm:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mercaforte
      - POSTGRES_PASSWORD=mercaforte
      - POSTGRES_DB=mercaforte
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mercaforte -d mercaforte" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    driver: bridge
