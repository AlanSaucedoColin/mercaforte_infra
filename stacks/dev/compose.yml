services:
  osrm:
    build:
      context: ./osrm
    image: mercaforte-osrm-routing:6.0.0
    # Coordinador de bloqueos pausado; servir el mapa base sin PostgreSQL
    entrypoint: [ "osrm-routed" ]
    command: [ "--algorithm", "MLD", "--threads", "2", "--max-table-size", "1400", "/data/morelos.osrm" ]
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data/osrm:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:5000/nearest/v1/driving/-99.2216,18.9242" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    environment:
      VROOM_ROUTER: osrm
      VROOM_LOG: /conf
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/vroom:/conf
      - type: bind
        source: ./configs/vroom/config.yml
        target: /conf/config.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3000/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      osrm:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mercaforte
      - POSTGRES_PASSWORD=mercaforte
      - POSTGRES_DB=mercaforte
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mercaforte -d mercaforte" ]
      interval: 5s
      timeout: 5s
      retries: 10

  wildfly:
    build: ./wildfly
    container_name: wildfly
    restart: always
    command: [ "/opt/jboss/wildfly/bin/standalone.sh", "-b", "0.0.0.0", "-bmanagement", "0.0.0.0" ]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mercaforte
      DB_USER: mercaforte
      DB_PASSWORD: mercaforte
    ports:
      - "8082:8080"
      - "9990:9990"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./data/nginx/dist:/usr/share/nginx/html:ro
      - type: bind
        source: ./configs/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

networks:
  default:
    driver: bridge
